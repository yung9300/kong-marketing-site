# Kong geo-redirects — generic homepage (/) is the default.
# Malaysian visitors -> /malaysia ; Australian visitors -> /australia.
#
# Country codes MUST be uppercase ISO-3166-1 alpha-2.
# force = true is required because / serves a real index.html file.
# Conditions match GeoIP only, so search bots (crawling from US IPs)
# are never redirected — no user-agent logic.
#
# NOTE: Netlify's own `nf_country` cookie overrides GeoIP. The region
# switcher sets nf_country=US, so testing after clicking it will keep
# you on the global site until that cookie is cleared.

[[redirects]]
  from = "/"
  to = "/malaysia"
  status = 302
  force = true
  conditions = { Country = ["MY"] }

[[redirects]]
  from = "/index.html"
  to = "/malaysia"
  status = 302
  force = true
  conditions = { Country = ["MY"] }

[[redirects]]
  from = "/"
  to = "/australia"
  status = 302
  force = true
  conditions = { Country = ["AU"] }

[[redirects]]
  from = "/index.html"
  to = "/australia"
  status = 302
  force = true
  conditions = { Country = ["AU"] }

# ---------------------------------------------------------------------------
# AI visit counter
#
# Netlify labels every request with a Netlify-Agent-Category header
# (browser, ai-agent, crawler, ...). The edge function in
# netlify/edge-functions/ai-visit-log.ts only runs for ai-agent and
# crawler requests (see the `header` matcher in that file), writes one
# JSON record per visit to the "ai-visits" Blobs store, and passes the
# request through untouched. Human visitors never trigger it.
#
# Scheduled functions (netlify/functions):
#   ai-visits-daily.mts   00:20 Malaysia time, rolls up yesterday's visits
#   ai-visits-weekly.mts  Monday 09:00 Malaysia time, 7-day summary
# Endpoint:
#   ai-visits.mts         GET /api/ai-visits  (needs AI_VISITS_TOKEN env var)
#
# Schedules are declared inside each function file. Nothing else here
# needs to change when the cron times move.
# ---------------------------------------------------------------------------

[build]
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[functions]
  node_bundler = "esbuild"
